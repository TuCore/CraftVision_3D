openapi: 3.0.3
info:
  title: Account Password Policy
  version: 1.0.0
  description: Password rules for email registration and password reset. Existing account login and federated Google login do not require a new local password.
paths:
  /api/auth/register:
    post:
      summary: Register with a password meeting all five requirements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password]
              properties:
                fullName: { type: string }
                email: { type: string, format: email }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '200': { description: Account created with an authentication response }
        '400':
          description: Password does not satisfy the policy, or another registration validation failed. No account is created for an invalid password.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /api/auth/reset-password:
    post:
      summary: Reset a password using a valid one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '200': { description: Password updated }
        '400': { description: Password violates the policy or the token is invalid. A weak password does not change the account or consume the reset token. }
components:
  schemas:
    Password:
      type: string
      format: password
      writeOnly: true
      minLength: 8
      description: At least 8 Unicode code points, including an uppercase letter (Lu), a lowercase letter (Ll), a decimal digit (Nd), and a punctuation or symbol character (P or S). Whitespace and letters with accents do not count as special characters. Passwords are not trimmed or normalized. Every rule is validated again by the backend.
