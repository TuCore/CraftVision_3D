openapi: 3.0.3
info:
  title: CraftVision 3D - Core API
  description: Đặc tả API cho các dịch vụ cốt lõi của hệ thống CraftVision 3D (Xử lý model 3D, Quản lý tài khoản).
  version: 1.0.0
  contact:
    name: Backend Team

servers:
  - url: http://localhost:5000
    description: Môi trường Development (Local Gateway)
  - url: https://api.craftvision3d.com
    description: Môi trường Production

paths:
  /api/v1/auth/login:
    post:
      summary: Đăng nhập hệ thống
      description: Nhận Token JWT để sử dụng cho các API yêu cầu xác thực.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Sai email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects:
    get:
      summary: Lấy danh sách dự án 3D
      description: Trả về danh sách các dự án 3D của người dùng hiện tại đang đăng nhập.
      tags:
        - Projects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Chưa đăng nhập (Thiếu Token)

  /api/user/account:
    delete:
      summary: Xoá / vô hiệu hoá tài khoản người dùng
      description: Vô hiệu hoá tài khoản hiện tại đang đăng nhập (soft-delete).
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Xoá tài khoản thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Tài khoản của bạn đã được xoá thành công."
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ
        '404':
          description: Không tìm thấy tài khoản

  /api/cart:
    get:
      tags: [Cart]
      summary: Lấy giỏ hàng hiện tại
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Giỏ hàng } }
    delete:
      tags: [Cart]
      summary: Xóa toàn bộ giỏ hàng
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Đã xóa } }
  /api/cart/items:
    post:
      tags: [Cart]
      summary: Thêm sản phẩm vào giỏ hàng
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartItemRequest' } } } }
      responses: { '200': { description: Giỏ hàng sau cập nhật } }
  /api/cart/items/{itemId}:
    put:
      tags: [Cart]
      summary: Cập nhật số lượng
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: itemId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Giỏ hàng sau cập nhật } }
    delete:
      tags: [Cart]
      summary: Xóa sản phẩm khỏi giỏ
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: itemId, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Đã xóa } }
  /api/favorites:
    get:
      tags: [Favorites]
      summary: Danh sách yêu thích
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Danh sách yêu thích } }
  /api/favorites/{productId}:
    post:
      tags: [Favorites]
      summary: Thêm yêu thích
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: productId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Đã thêm } }
    delete:
      tags: [Favorites]
      summary: Xóa yêu thích
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: productId, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Đã xóa } }
  /api/vouchers/validate:
    post:
      tags: [Vouchers]
      summary: Kiểm tra voucher và tính giảm giá
      responses: { '200': { description: Kết quả áp dụng voucher } }
  /api/shipping/methods:
    get:
      tags: [Shipping]
      summary: Lấy phương thức giao hàng
      responses: { '200': { description: Danh sách phương thức } }
  /api/shipping/quote:
    post:
      tags: [Shipping]
      summary: Tính phí giao hàng
      responses: { '200': { description: Phí và thời gian dự kiến } }
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Lấy thông báo người dùng
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Danh sách thông báo } }
  /api/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Đánh dấu đã đọc
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Đã cập nhật } }
  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Đánh dấu tất cả đã đọc
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Đã cập nhật } }
  /api/notifications/devices:
    post:
      tags: [Notifications]
      summary: Đăng ký push token thiết bị
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Đã đăng ký } }
  /api/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Yêu cầu mã đặt lại mật khẩu
      responses: { '200': { description: Luôn trả thông báo trung lập } }
  /api/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Đặt lại mật khẩu bằng mã một lần
      responses: { '200': { description: Mật khẩu đã cập nhật } }
  /api/payments:
    post:
      tags: [Payments]
      summary: Tạo PayOS checkout link cho đơn hàng
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Checkout URL } }
  /api/orders:
    get:
      tags: [Orders]
      summary: Liệt kê tất cả đơn hàng cho quản trị viên
      description: Bao gồm đơn sản phẩm vật lý và giao dịch thiệp 3D số đã thanh toán.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sách đơn hàng phân trang
    post:
      tags: [Orders]
      summary: Tạo đơn hàng sản phẩm
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Đơn hàng đã tạo } }
  /api/orders/me:
    get:
      tags: [Orders]
      summary: Lịch sử mua hàng của người dùng
      description: Trả về cả đơn sản phẩm và giao dịch thiệp 3D số đã thanh toán.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lịch sử đơn hàng phân trang
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Chi tiết đơn hàng
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Chi tiết đơn hàng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /api/payments/orders/{orderId}:
    get:
      tags: [Payments]
      summary: Kiểm tra trạng thái thanh toán đơn hàng
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: orderId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Trạng thái thanh toán } }

  /api/gift-chat/suggestions:
    post:
      tags: [GiftChat]
      summary: Tư vấn quà tặng DIY & gợi ý sản phẩm gắn thiệp NFC từ Database
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSuggestionsRequest'
      responses:
        '200':
          description: Trả về câu trả lời tư vấn của AI kèm danh sách ý tưởng DIY và sản phẩm khớp trong Database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftChatResponse'
  /api/gift-chat/sessions:
    get:
      tags: [GiftChat]
      summary: Liệt kê các phiên tư vấn quà tặng của người dùng hiện tại
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sách phiên theo thời gian hoạt động gần nhất
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatSessionSummary' }
  /api/gift-chat/sessions/{sessionId}/messages:
    get:
      tags: [GiftChat]
      summary: Lấy toàn bộ tin nhắn của một phiên thuộc người dùng hiện tại
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Chi tiết phiên và lịch sử tin nhắn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSessionDetail' }
        '404': { description: Không tìm thấy phiên thuộc người dùng hiện tại }
  /api/gift-chat/sessions/{sessionId}:
    delete:
      tags: [GiftChat]
      summary: Xóa một phiên và toàn bộ tin nhắn liên quan
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Đã xóa phiên }
        '404': { description: Không tìm thấy phiên thuộc người dùng hiện tại }
  /api/gift-chat/sessions/{sessionId}/title:
    patch:
      tags: [GiftChat]
      summary: Đổi tiêu đề phiên chat
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChatSessionTitle' }
      responses:
        '200': { description: Đã cập nhật tiêu đề }
        '404': { description: Không tìm thấy phiên thuộc người dùng hiện tại }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: dev@craftvision3d.com
        password:
          type: string
          format: password
          example: "StrongP@ssw0rd!"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expiresIn:
          type: integer
          example: 3600
          description: Thời gian hết hạn của token (giây)

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "Mô hình Biệt thự 3D - Khách hàng A"
        createdAt:
          type: string
          format: date-time
          example: "2024-05-10T10:00:00Z"
        modelUrl:
          type: string
          example: "https://s3.aws.com/craftvision/models/abc.gltf"

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "UNAUTHORIZED"
        message:
          type: string
          example: "Sai thông tin đăng nhập, vui lòng thử lại!"

    Order:
      type: object
      required: [id, orderCode, orderKind, paymentStatus, orderStatus, totalAmount, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        orderCode: { type: string }
        orderKind: { type: string, enum: [Product, DigitalCard] }
        cardId: { type: string, format: uuid, nullable: true }
        cardTemplateSlug: { type: string, nullable: true }
        paymentMethod: { type: string }
        paymentStatus: { type: string }
        orderStatus: { type: string }
        receiverName: { type: string, nullable: true }
        receiverPhone: { type: string, nullable: true }
        receiverAddress: { type: string, nullable: true }
        shippingFee: { type: number }
        totalAmount: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { type: object }

    CartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }

    GenerateSuggestionsRequest:
      type: object
      properties:
        userId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid, nullable: true }
        prompt: { type: string, example: "Tư vấn quà sinh nhật cho bạn nữ tầm 50k" }
        imageUrl: { type: string, nullable: true }
        maxCost: { type: number, nullable: true, example: 150000 }
        occasion: { type: string, nullable: true, example: "Birthday" }
        difficulty: { type: string, enum: [Easy, Medium, Hard], nullable: true }

    GiftChatResponse:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        sessionTitle: { type: string }
        reply: { type: string }
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/GiftSuggestionItem'

    GiftSuggestionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        difficulty: { type: string, enum: [Easy, Medium, Hard] }
        estimatedCostRange: { type: string }
        estimatedTime: { type: string }
        description: { type: string }
        totalCost: { type: string }
        searchKeyword: { type: string }
        youtubeSearchQuery: { type: string }
        videoUrl: { type: string }
        materialsJson: { type: string }
        matchedProductId: { type: string, format: uuid, nullable: true }
        matchedProductName: { type: string, nullable: true }
        matchedProductPrice: { type: number, nullable: true }
        matchedProductSupportsNfc: { type: boolean, nullable: true }

    ChatSessionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        messageCount: { type: integer }
        lastMessagePreview: { type: string, nullable: true }

    ChatSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ChatSessionSummary'
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/ChatMessageItem' }

    ChatMessageItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, ai] }
        content: { type: string }
        imageUrl: { type: string, nullable: true }
        suggestions:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/GiftSuggestionItem' }
        createdAt: { type: string, format: date-time }

    UpdateChatSessionTitle:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
